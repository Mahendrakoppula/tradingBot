name: Deploy trading-bot

# Triggered by a push/merge to main - the branch -> merge -> main workflow is
# what actually ships a change. Feature work should happen on branches;
# nothing deploys until it lands on main.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption, no static keys
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Postgres for the engine DAL tests (tests/test_engine_db.py) - the
    # jsonb / ON CONFLICT / CHECK behaviour the bot relies on has no SQLite
    # stand-in. Tests skip the Postgres leg when TECH_TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tech
          POSTGRES_PASSWORD: tech
          POSTGRES_DB: tech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tech"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TECH_TEST_DATABASE_URL: postgresql://tech:tech@localhost:5432/tech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required repo Variables are set
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID DEPLOY_BUCKET INSTANCE_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty. It must be added under Settings -> Secrets and variables -> Actions -> the VARIABLES tab (not Secrets) as a repository variable named exactly '$name'."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "One or more required repository Variables are missing or empty - see errors above." >&2
            exit 1
          fi
          echo "All required Variables are present (AWS_ACCOUNT_ID length: ${#AWS_ACCOUNT_ID}, DEPLOY_BUCKET: $DEPLOY_BUCKET, INSTANCE_ID: $INSTANCE_ID)"
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}

      - name: Debug actual OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # base64url -> base64, pad to a multiple of 4
          PAYLOAD="${PAYLOAD//-/+}"
          PAYLOAD="${PAYLOAD//_/\/}"
          case $(( ${#PAYLOAD} % 4 )) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "$PAYLOAD" | base64 -d | python3 -c "
          import sys, json
          c = json.load(sys.stdin)
          for k in ('sub', 'aud', 'iss', 'repository', 'repository_owner', 'ref', 'event_name', 'workflow_ref'):
              print(f'{k}: {c.get(k)}')
          "
          echo "role-to-assume will be: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/trading-bot-github-deploy-role"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/trading-bot-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deploy package (code + non-secret config only)
        run: |
          python -c "
          import zipfile, pathlib
          root = pathlib.Path('.')
          out = pathlib.Path('deploy_package.zip')
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              # rglob, not glob: trading_bot/engine/ is a subpackage and must ship too
              for f in root.rglob('trading_bot/**/*.py'):
                  if '__pycache__' not in f.parts:
                      z.write(f, f.as_posix())
              z.write('requirements.txt', 'requirements.txt')
              z.write('deploy/config.env', 'config.env')
              z.write('deploy/fetch_secrets.sh', 'deploy/fetch_secrets.sh')
              z.write('deploy/assemble_env.py', 'deploy/assemble_env.py')
              z.write('deploy/trading-bot.service', 'deploy/trading-bot.service')
              z.write('deploy/trading-bot-technical.service', 'deploy/trading-bot-technical.service')
              z.write('deploy/trading-bot-bootstrap.service', 'deploy/trading-bot-bootstrap.service')
              z.write('deploy/sync_state_to_s3.sh', 'deploy/sync_state_to_s3.sh')
              z.write('deploy/trading-bot-s3-sync.service', 'deploy/trading-bot-s3-sync.service')
              z.write('deploy/trading-bot-s3-sync.timer', 'deploy/trading-bot-s3-sync.timer')
              # second bot: Postgres one-time setup + nightly pg_dump (deploy/DEPLOY.md section 8)
              z.write('deploy/setup_postgres.sh', 'deploy/setup_postgres.sh')
              z.write('deploy/pgdump_to_s3.sh', 'deploy/pgdump_to_s3.sh')
              z.write('deploy/trading-bot-pgdump.service', 'deploy/trading-bot-pgdump.service')
              z.write('deploy/trading-bot-pgdump.timer', 'deploy/trading-bot-pgdump.timer')
              z.write('deploy/engine_review.sh', 'deploy/engine_review.sh')
              z.write('deploy/trading-bot-engine-review.service', 'deploy/trading-bot-engine-review.service')
              z.write('deploy/trading-bot-engine-review.timer', 'deploy/trading-bot-engine-review.timer')
              # MCX crude-oil spike (shadow-only, own unit + database; enabled by deploy/mcx.env)
              z.write('deploy/mcx.env', 'deploy/mcx.env')
              z.write('deploy/trading-bot-mcx.service', 'deploy/trading-bot-mcx.service')
              z.write('deploy/ensure_mcx_db.sh', 'deploy/ensure_mcx_db.sh')
              # nightly review/tuning agent - see deploy/setup_claude_agent.sh
              z.write('deploy/setup_claude_agent.sh', 'deploy/setup_claude_agent.sh')
              z.write('deploy/daily_review_prompt.md', 'deploy/daily_review_prompt.md')
              z.write('deploy/trading-bot-review.service', 'deploy/trading-bot-review.service')
              z.write('deploy/trading-bot-review.timer', 'deploy/trading-bot-review.timer')
          print('built', out, out.stat().st_size, 'bytes')
          "

      - name: Upload to S3
        run: aws s3 cp deploy_package.zip "s3://${{ vars.DEPLOY_BUCKET }}/trading-bot/app.zip"

      - name: Start instance if it's currently stopped
        id: instance_state
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            echo "we_started_it=true" >> "$GITHUB_OUTPUT"
          else
            echo "we_started_it=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for SSM agent online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              echo "SSM online"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM agent" >&2
          exit 1

      - name: Redeploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "trading-bot CI deploy ${{ github.sha }}" \
            --parameters "commands=[
              'systemctl stop trading-bot.service',
              'systemctl stop trading-bot-technical.service || true',
              'systemctl stop trading-bot-mcx.service || true',
              'aws s3 cp s3://${{ vars.DEPLOY_BUCKET }}/trading-bot/app.zip /opt/trading-bot/app.zip',
              'unzip -oq /opt/trading-bot/app.zip -d /opt/trading-bot',
              'rm -f /opt/trading-bot/app.zip',
              '/opt/trading-bot/.venv/bin/pip install --quiet -r /opt/trading-bot/requirements.txt',
              'chmod +x /opt/trading-bot/deploy/fetch_secrets.sh /opt/trading-bot/deploy/sync_state_to_s3.sh /opt/trading-bot/deploy/pgdump_to_s3.sh /opt/trading-bot/deploy/setup_postgres.sh /opt/trading-bot/deploy/engine_review.sh /opt/trading-bot/deploy/ensure_mcx_db.sh',
              'chown -R tradingbot:tradingbot /opt/trading-bot',
              'cp /opt/trading-bot/deploy/trading-bot-bootstrap.service /etc/systemd/system/trading-bot-bootstrap.service',
              'cp /opt/trading-bot/deploy/trading-bot.service /etc/systemd/system/trading-bot.service',
              'cp /opt/trading-bot/deploy/trading-bot-technical.service /etc/systemd/system/trading-bot-technical.service',
              'cp /opt/trading-bot/deploy/trading-bot-mcx.service /etc/systemd/system/trading-bot-mcx.service',
              'cp /opt/trading-bot/deploy/trading-bot-s3-sync.service /etc/systemd/system/trading-bot-s3-sync.service',
              'cp /opt/trading-bot/deploy/trading-bot-s3-sync.timer /etc/systemd/system/trading-bot-s3-sync.timer',
              'cp /opt/trading-bot/deploy/trading-bot-pgdump.service /etc/systemd/system/trading-bot-pgdump.service',
              'cp /opt/trading-bot/deploy/trading-bot-pgdump.timer /etc/systemd/system/trading-bot-pgdump.timer',
              'cp /opt/trading-bot/deploy/trading-bot-engine-review.service /etc/systemd/system/trading-bot-engine-review.service',
              'cp /opt/trading-bot/deploy/trading-bot-engine-review.timer /etc/systemd/system/trading-bot-engine-review.timer',
              'if [ -f /opt/trading-bot/deploy/trading-bot-review.service ]; then cp /opt/trading-bot/deploy/trading-bot-review.service /etc/systemd/system/trading-bot-review.service; fi',
              'if [ -f /opt/trading-bot/deploy/trading-bot-review.timer ]; then cp /opt/trading-bot/deploy/trading-bot-review.timer /etc/systemd/system/trading-bot-review.timer; fi',
              'systemctl daemon-reload',
              'systemctl enable --now trading-bot-s3-sync.timer',
              'if [ -f /etc/systemd/system/trading-bot-review.timer ]; then systemctl enable --now trading-bot-review.timer; fi',
              'systemctl start trading-bot.service',
              'systemctl enable --now trading-bot-pgdump.timer',
              'systemctl enable --now trading-bot-engine-review.timer',
              'systemctl enable --now trading-bot-technical.service',
              'if grep -q ^TECH_MCX_ENABLED=true /opt/trading-bot/deploy/mcx.env; then /opt/trading-bot/deploy/ensure_mcx_db.sh && systemctl enable --now trading-bot-mcx.service; else systemctl disable --now trading-bot-mcx.service || true; fi'
            ]" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output json | tee redeploy_result.json
          STATUS=$(python3 -c "import json; print(json.load(open('redeploy_result.json'))['Status'])")
          if [ "$STATUS" != "Success" ]; then
            echo "Redeploy command did not succeed (status: $STATUS)" >&2
            exit 1
          fi

      - name: Stop instance again if we started it (outside its scheduled window)
        if: steps.instance_state.outputs.we_started_it == 'true'
        run: aws ec2 stop-instances --instance-ids "${{ vars.INSTANCE_ID }}"
