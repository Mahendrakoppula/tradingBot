name: Deploy codex

# Triggered by a push to codex-bot-main ONLY - this branch never merges
# into main, and main's own deploy.yml (triggered on push to `main`) must
# never fire from here or vice versa.
#
# Codex runs on the SAME shared EC2 instance as the two existing
# trading-bot-* services (not new infra - see README.md), as a third,
# independent systemd service (codex-trading.service) in its own
# /opt/codex-trading directory/venv. It reuses the existing
# trading-bot-github-deploy-role and the existing AWS_ACCOUNT_ID/
# DEPLOY_BUCKET/INSTANCE_ID repo Variables (these are repo-scoped, not
# branch-scoped, so no new *_ variables are needed) and deploys its
# package under the s3://.../trading-bot/codex/ prefix, which that role
# already has PutObject access to - no new IAM permissions needed.
#
# NOTE: the role's trust policy currently only allows OIDC tokens whose
# `sub` ref is `refs/heads/main`. Until that trust policy is widened to
# also allow `refs/heads/codex-bot-main` (one `aws iam
# update-assume-role-policy` call - needs admin IAM access, see
# deploy/README-deploy-role-trust-update.md), this workflow's
# `Configure AWS credentials via OIDC` step will fail. Until then, deploy
# manually via the same SSM commands this workflow runs (see that file).
on:
  push:
    branches: [codex-bot-main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required repo Variables are set
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID DEPLOY_BUCKET INSTANCE_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty. It must exist as a repository Variable (shared with main's deploy.yml)."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/trading-bot-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deploy package (code + deploy scripts, no secrets)
        run: |
          zip -r deploy_package.zip \
            app config monitoring data market_state features \
            requirements.txt \
            deploy/codex-trading.service

      - name: Upload to S3
        run: aws s3 cp deploy_package.zip "s3://${{ vars.DEPLOY_BUCKET }}/trading-bot/codex/app.zip"

      - name: Start instance if it's currently stopped
        id: instance_state
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "${{ vars.INSTANCE_ID }}"
            echo "we_started_it=true" >> "$GITHUB_OUTPUT"
          else
            echo "we_started_it=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for SSM agent online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ vars.INSTANCE_ID }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM agent" >&2
          exit 1

      - name: Redeploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "codex CI deploy ${{ github.sha }}" \
            --parameters "commands=[
              'systemctl stop codex-trading.service || true',
              'mkdir -p /opt/codex-trading',
              'aws s3 cp s3://${{ vars.DEPLOY_BUCKET }}/trading-bot/codex/app.zip /opt/codex-trading/app.zip',
              'unzip -oq /opt/codex-trading/app.zip -d /opt/codex-trading',
              'rm -f /opt/codex-trading/app.zip',
              'test -d /opt/codex-trading/.venv || python3.12 -m venv /opt/codex-trading/.venv',
              '/opt/codex-trading/.venv/bin/pip install --quiet --upgrade pip',
              '/opt/codex-trading/.venv/bin/pip install --quiet -r /opt/codex-trading/requirements.txt',
              'chown -R tradingbot:tradingbot /opt/codex-trading',
              'cp /opt/codex-trading/deploy/codex-trading.service /etc/systemd/system/codex-trading.service',
              'systemctl daemon-reload',
              'systemctl enable --now codex-trading.service'
            ]" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output table

      - name: Stop instance again if we started it (outside its scheduled window)
        if: steps.instance_state.outputs.we_started_it == 'true'
        run: aws ec2 stop-instances --instance-ids "${{ vars.INSTANCE_ID }}"
