name: Deploy codex

# Triggered by a push to codex-bot-main ONLY - this branch never merges
# into main, and main's own deploy.yml (triggered on push to `main`) must
# never fire from here or vice versa. Uses distinctly CODEX_-prefixed repo
# Variables/Secrets throughout so nothing collides with the existing
# trading-bot deploy pipeline's AWS_ACCOUNT_ID/DEPLOY_BUCKET/INSTANCE_ID.
on:
  push:
    branches: [codex-bot-main]

permissions:
  id-token: write   # OIDC -> AWS role assumption, no static keys - same pattern as the main-branch pipeline
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required repo Variables are set
        run: |
          missing=0
          for name in CODEX_AWS_ACCOUNT_ID CODEX_DEPLOY_BUCKET CODEX_INSTANCE_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty. Add it under Settings -> Secrets and variables -> Actions -> Variables tab as '$name'."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            exit 1
          fi
        env:
          CODEX_AWS_ACCOUNT_ID: ${{ vars.CODEX_AWS_ACCOUNT_ID }}
          CODEX_DEPLOY_BUCKET: ${{ vars.CODEX_DEPLOY_BUCKET }}
          CODEX_INSTANCE_ID: ${{ vars.CODEX_INSTANCE_ID }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.CODEX_AWS_ACCOUNT_ID }}:role/codex-trading-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build deploy package (code + deploy scripts, no secrets)
        run: |
          zip -r deploy_package.zip \
            app config monitoring \
            requirements.txt \
            deploy/Dockerfile deploy/docker-compose.yml deploy/codex-trading.service

      - name: Upload to S3
        run: aws s3 cp deploy_package.zip "s3://${{ vars.CODEX_DEPLOY_BUCKET }}/codex-trading/app.zip"

      - name: Start instance if it's currently stopped
        run: |
          STATE=$(aws ec2 describe-instances --instance-ids "${{ vars.CODEX_INSTANCE_ID }}" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "${{ vars.CODEX_INSTANCE_ID }}"
          fi

      - name: Wait for SSM agent online
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ vars.CODEX_INSTANCE_ID }}" \
              --query "InstanceInformationList[0].PingStatus" --output text 2>/dev/null || echo "")
            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM agent" >&2
          exit 1

      - name: Redeploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.CODEX_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "codex CI deploy ${{ github.sha }}" \
            --parameters "commands=[
              'mkdir -p /opt/codex-trading',
              'aws s3 cp s3://${{ vars.CODEX_DEPLOY_BUCKET }}/codex-trading/app.zip /opt/codex-trading/app.zip',
              'unzip -oq /opt/codex-trading/app.zip -d /opt/codex-trading',
              'rm -f /opt/codex-trading/app.zip',
              'cp /opt/codex-trading/deploy/codex-trading.service /etc/systemd/system/codex-trading.service',
              'systemctl daemon-reload',
              'systemctl enable --now codex-trading.service',
              'cd /opt/codex-trading && docker compose -f deploy/docker-compose.yml up -d --build'
            ]" \
            --query "Command.CommandId" --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.CODEX_INSTANCE_ID }}" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.CODEX_INSTANCE_ID }}" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output table
