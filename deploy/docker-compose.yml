services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    volumes:
      - timescale_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://codex:codex@timescaledb:5432/codex
    depends_on:
      timescaledb:
        condition: service_healthy

  # Placeholder only in Phase 1 - see README.md, dashboard/ is empty until
  # Phase 15. Commented out rather than pointing at a nonexistent app so
  # `docker compose up` doesn't fail on a missing image/context.
  # dashboard:
  #   build:
  #     context: ..
  #     dockerfile: deploy/Dockerfile.dashboard
  #   ports:
  #     - "127.0.0.1:8501:8501"
  #   depends_on:
  #     timescaledb:
  #       condition: service_healthy

volumes:
  timescale_data:
